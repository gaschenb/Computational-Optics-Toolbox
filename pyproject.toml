[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticstoolbox"
version = "1.0.0"
description = "Computational optics toolbox: digital holography, phase retrieval, tomography, computational microscopy and cameras, photon-counting and quantum imaging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=9",
]

[project.urls]
Homepage = "https://github.com/gaschenb/Computational-Optics-Toolbox"
Repository = "https://github.com/gaschenb/Computational-Optics-Toolbox.git"

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]
gui3d = ["PyQt5>=5.15", "pyqtgraph>=0.13", "PyOpenGL>=3.1"]
io = ["tifffile", "h5py"]

[project.scripts]
opticstoolbox = "opticstoolbox.cli:main"
opticstoolbox-gui = "opticstoolbox.gui.app:main"   # console entry point, so start-up errors show in the terminal

[tool.setuptools.packages.find]
include = ["opticstoolbox*"]
